spring:
  application:
    name: cineflow
  datasource:
    url: ${CINEFLOW_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cineflow}
    username: ${CINEFLOW_DATASOURCE_USERNAME:cineflow}
    password: ${CINEFLOW_DATASOURCE_PASSWORD:cineflow}
    hikari:
      maximum-pool-size: ${CINEFLOW_DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cineflow
  flyway:
    schemas: cineflow
    default-schema: cineflow
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
