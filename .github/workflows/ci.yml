name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend for SPA packaging
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Backend production jar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test
      - name: Verify Flyway migration is packaged
        working-directory: backend
        run: |
          jar tf build/libs/*.jar | grep 'db/migration/V1__movie_catalog.sql'
          jar tf build/libs/*.jar | grep 'static/index.html'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers for Vitest browser mode
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Production build
        working-directory: frontend
        run: pnpm build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build -t cineflow:ci .
