services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cineflow
      POSTGRES_USER: cineflow
      POSTGRES_PASSWORD: cineflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineflow -d cineflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cineflow_pg:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CINEFLOW_DATASOURCE_URL: jdbc:postgresql://db:5432/cineflow
      CINEFLOW_DATASOURCE_USERNAME: cineflow
      CINEFLOW_DATASOURCE_PASSWORD: cineflow
      CINEFLOW_DB_POOL_SIZE: "5"
      CINEFLOW_JWT_SECRET: local-dev-only-jwt-secret-key-32b
      CINEFLOW_BOOTSTRAP_ADMIN_USERNAME: administrator
      CINEFLOW_BOOTSTRAP_ADMIN_PASSWORD: AdminPassw0rd!
      CINEFLOW_AUTH_COOKIE_SECURE: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  cineflow_pg:
