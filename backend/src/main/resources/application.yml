spring:
  application:
    name: cineflow
  datasource:
    url: ${CINEFLOW_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cineflow}
    username: ${CINEFLOW_DATASOURCE_USERNAME:cineflow}
    password: ${CINEFLOW_DATASOURCE_PASSWORD:cineflow}
    hikari:
      maximum-pool-size: ${CINEFLOW_DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cineflow
  flyway:
    schemas: cineflow
    default-schema: cineflow
    create-schemas: true
    locations: classpath:db/migration,classpath:db/dev
  mvc:
    problemdetails:
      enabled: true
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

cineflow:
  auth:
    access-token-ttl: PT15M
    refresh-token-ttl: PT8H
    cookie:
      name: cineflow_refresh
      secure: ${CINEFLOW_AUTH_COOKIE_SECURE:true}
      same-site: Lax
      path: /api/auth
    login-rate-limit: 10
    refresh-rate-limit: 30
    rate-limit-window: PT1M
    jwt:
      secret: ${CINEFLOW_JWT_SECRET:}
  bootstrap:
    administrator:
      username: ${CINEFLOW_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${CINEFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
  tmdb:
    access-token: ${CINEFLOW_TMDB_ACCESS_TOKEN:}
    base-url: ${CINEFLOW_TMDB_BASE_URL:https://api.themoviedb.org/3}
    image-base-url: ${CINEFLOW_TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p/w500}
  catalog:
    search-rate-limit: 20
    rate-limit-window: PT1M

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${CINEFLOW_DB_POOL_SIZE:3}
  flyway:
    locations: classpath:db/migration
