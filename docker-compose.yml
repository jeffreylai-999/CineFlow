services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cineflow
      POSTGRES_USER: cineflow
      POSTGRES_PASSWORD: cineflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineflow -d cineflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cineflow_pg:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CINEFLOW_DATASOURCE_URL: jdbc:postgresql://db:5432/cineflow
      CINEFLOW_DATASOURCE_USERNAME: cineflow
      CINEFLOW_DATASOURCE_PASSWORD: cineflow
      CINEFLOW_DB_POOL_SIZE: "5"
      CINEFLOW_JWT_SECRET: ${CINEFLOW_JWT_SECRET:?Set CINEFLOW_JWT_SECRET in .env}
      CINEFLOW_BOOTSTRAP_ADMIN_USERNAME: ${CINEFLOW_BOOTSTRAP_ADMIN_USERNAME:?Set CINEFLOW_BOOTSTRAP_ADMIN_USERNAME in .env}
      CINEFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${CINEFLOW_BOOTSTRAP_ADMIN_PASSWORD:?Set CINEFLOW_BOOTSTRAP_ADMIN_PASSWORD in .env}
      CINEFLOW_AUTH_COOKIE_SECURE: "${CINEFLOW_AUTH_COOKIE_SECURE:-false}"
      CINEFLOW_TMDB_ACCESS_TOKEN: ${CINEFLOW_TMDB_ACCESS_TOKEN:-}
      CINEFLOW_OMDB_API_KEY: ${CINEFLOW_OMDB_API_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC
    depends_on:
      db:
        condition: service_healthy

volumes:
  cineflow_pg:
